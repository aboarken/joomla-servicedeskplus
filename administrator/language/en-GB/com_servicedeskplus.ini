COM_SERVICEDESKPLUS_DIAG_TITLE="Diagnostics"
COM_SERVICEDESKPLUS_DIAG_INTRO="One click runs every check from this Joomla server: the connection, a few rows of every endpoint the portal reads, and whether the other known endpoints answer. Copy the report and send it to whoever supports this portal. Enter a requester's e-mail (yours, for example) to also check that the portal can match that person and finds their requests, assets and loans. The report holds only paths, results, counts, field paths, kinds of values and status texts."
