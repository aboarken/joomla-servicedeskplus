COM_SERVICEDESKPLUS_SETTINGS_FIELDSET_CONNECTION="Connection"
COM_SERVICEDESKPLUS_SETTINGS_FIELDSET_LIMITS="Cache and rate limits"
COM_SERVICEDESKPLUS_SETTINGS_FIELDSET_USERS="Users"
COM_SERVICEDESKPLUS_SETTINGS_AUTO_APPROVE="New users"
COM_SERVICEDESKPLUS_SETTINGS_AUTO_APPROVE_AUTO="Approve automatically"
COM_SERVICEDESKPLUS_SETTINGS_AUTO_APPROVE_WAIT="Wait for administrator approval"
COM_SERVICEDESKPLUS_SETTINGS_AUTO_APPROVE_DESC="On a user's first visit, the portal looks for the ServiceDesk Plus user with the same e-mail address. <strong>Approve automatically:</strong> that match works at once. <strong>Wait for administrator approval:</strong> the user waits until you confirm the match in User Mappings; choose this where users can change their Joomla e-mail freely, since someone could enter a colleague's address before their first visit. Either way, when a user's e-mail changes later, the mapping is suspended until you approve it. Users waiting now are approved on their next visit once this is set to Approve automatically."
COM_SERVICEDESKPLUS_SETTINGS_BASE_URL="Base URL"
COM_SERVICEDESKPLUS_SETTINGS_BASE_URL_DESC="Address of your ServiceDesk Plus server, without /api/v3, using the name its certificate is issued for. Example: https://sdp.example.com:8080. If Joomla must reach SDP through another address (firewall, NAT), put that address in &quot;Connect via&quot;."
COM_SERVICEDESKPLUS_SETTINGS_SERVICE_KEY="Service API key"
COM_SERVICEDESKPLUS_SETTINGS_SERVICE_KEY_DESC="API key of the dedicated technician account. It is encrypted and never shown again. Leave empty to keep the stored key."
COM_SERVICEDESKPLUS_SETTINGS_VERIFY_SSL="Verify SSL certificate"
COM_SERVICEDESKPLUS_SETTINGS_VERIFY_SSL_DESC="Keep this on. Turn it off only for testing against a server with a self-signed certificate; use the CA bundle option instead where possible."
COM_SERVICEDESKPLUS_SETTINGS_CA_BUNDLE="CA bundle path"
COM_SERVICEDESKPLUS_SETTINGS_CA_BUNDLE_DESC="Optional absolute path on the web server to a PEM file with the certificate authority that signed the ServiceDesk Plus certificate."
COM_SERVICEDESKPLUS_SETTINGS_CONNECT_VIA="Connect via (optional)"
COM_SERVICEDESKPLUS_SETTINGS_CONNECT_VIA_DESC="Use when ServiceDesk Plus is reached through a different address than its own name, for example a firewall virtual IP published as api.sdp.example.com:8080. Joomla opens the connection to this address but keeps using the host name from the Base URL for the certificate check and the Host header, so SDP's existing certificate for that name stays valid. Format: host, host:port or IP:port. Empty = connect to the Base URL directly."
COM_SERVICEDESKPLUS_SETTINGS_ERR_CONNECT_VIA="Connect via must be a host name or IP address, optionally followed by :port (for example api.sdp.example.com:8080)."
COM_SERVICEDESKPLUS_SETTINGS_SSL_PIN="Pinned certificate key"
COM_SERVICEDESKPLUS_SETTINGS_SSL_PIN_DESC="Use when ServiceDesk Plus is reached by IP address or has a self-signed certificate. Only a server whose certificate has exactly this public key is accepted; certificate authority and host name checks are replaced by this check. Format: sha256//... (several separated by ;). Use &quot;Read certificate pin&quot; and compare with the value computed on the SDP server (see README). Leave empty to use normal certificate checks."
COM_SERVICEDESKPLUS_SETTINGS_ERR_PIN="The pinned key must look like sha256// followed by 44 characters. Separate several pins with ;."
COM_SERVICEDESKPLUS_SETTINGS_ERR_PIN_HTTPS="Certificate pinning needs an https base URL."
COM_SERVICEDESKPLUS_SETTINGS_WARN_NO_VERIFY="SSL verification is off and no certificate key is pinned: API keys could be intercepted. Pin the certificate key or turn verification on."
COM_SERVICEDESKPLUS_SETTINGS_PINNED="Connections are accepted only from the server with the pinned certificate key."
COM_SERVICEDESKPLUS_READ_PIN="Read certificate pin"
COM_SERVICEDESKPLUS_PIN_READ="The server at the saved address presents this certificate key: <code>%1$s</code> (certificate %2$s, issued by %3$s, expires %4$s). Before pasting it into &quot;Pinned certificate key&quot;, compare it with the value computed on the SDP server itself, so you know no other server answered."
COM_SERVICEDESKPLUS_PIN_READ_FAILED="The certificate could not be read. Save an https base URL first and check that the server is reachable."
COM_SERVICEDESKPLUS_SETTINGS_TIMEOUT="Request timeout (seconds)"
COM_SERVICEDESKPLUS_SETTINGS_TIMEOUT_DESC="Maximum time for one API call."
COM_SERVICEDESKPLUS_SETTINGS_CONNECT_TIMEOUT="Connect timeout (seconds)"
COM_SERVICEDESKPLUS_SETTINGS_CONNECT_TIMEOUT_DESC="Maximum time to open the connection. Must not be larger than the request timeout."
COM_SERVICEDESKPLUS_SETTINGS_FIELDSET_REQUESTS="My Requests"
COM_SERVICEDESKPLUS_SETTINGS_REQUEST_STATUSES="Status filter values"
COM_SERVICEDESKPLUS_SETTINGS_REQUEST_STATUSES_DESC="Request status names offered in the status filter, separated by commas. Use the names exactly as they appear in ServiceDesk Plus (Admin, Status)."
COM_SERVICEDESKPLUS_SETTINGS_CACHE_MINUTES="Cache time (minutes)"
COM_SERVICEDESKPLUS_SETTINGS_CACHE_MINUTES_DESC="How long ServiceDesk Plus results (requests, approvals, loans, announcements, Dashboard figures) are used as they are, per user, 0 to 60 minutes. After that, a page is still shown at once with the user's last results (up to 7 days old, marked &quot;Updating…&quot;) and refreshed in the background. A user's own new requests and decisions refresh their lists at once. 0 reads ServiceDesk Plus on every page load and keeps nothing. Recommended: 5 to 15."
COM_SERVICEDESKPLUS_SETTINGS_RATE_CREATE="Requests per user per hour"
COM_SERVICEDESKPLUS_SETTINGS_RATE_CREATE_DESC="Maximum number of new requests one user can create in an hour."
COM_SERVICEDESKPLUS_SETTINGS_PARALLEL="Parallel API calls"
COM_SERVICEDESKPLUS_SETTINGS_PARALLEL_DESC="How many reads the portal sends to ServiceDesk Plus at the same time where it reads many records, as when My Approvals and the Dashboard check the approvals of each request, change, release and purchase order. 1 to 10; 1 sends them one after another (as before 1.20.0). Lower it if ServiceDesk Plus answers &quot;too many requests&quot;. Recommended: 6."
COM_SERVICEDESKPLUS_SETTINGS_RATE_DECIDE="Decisions per user per hour"
COM_SERVICEDESKPLUS_SETTINGS_RATE_DECIDE_DESC="Maximum number of approve or reject actions one user can send in an hour."

