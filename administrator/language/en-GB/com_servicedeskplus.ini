COM_SERVICEDESKPLUS_ENDPOINTS_TITLE="ServiceDesk Plus: Find Endpoints"
COM_SERVICEDESKPLUS_ENDPOINTS_BUTTON="Find Endpoints"
COM_SERVICEDESKPLUS_ENDPOINTS_INTRO="See which ServiceDesk Plus API endpoints this server offers and what they return. 1. Check which known endpoints answer to the API technician's key. 2. Select one and check it: the portal reads a few rows and shows their field paths, the kind of value in each and the status texts, never names, e-mails, subjects or other personal values. Only reading (GET) requests are sent, and results are kept in your own session only."
COM_SERVICEDESKPLUS_ENDPOINTS_STEP1="1. Known API Endpoints"
COM_SERVICEDESKPLUS_ENDPOINTS_STEP1_HELP="ServiceDesk Plus offers no list of its API endpoints on the server, so this list comes from ManageEngine's ServiceDesk Plus On Premise API collection (servicedeskplus.docs.buildwithfern.com): the endpoints the portal reads first, then the other top-level list endpoints, each with its name, section and a link to its documentation. Not every build or edition has every endpoint; the check reads one row of each and shows whether it answers."
